template:
  - sensor:
      - name: "SGY Advisor"
        unique_id: sgy_advisor
        icon: mdi:comment-question-outline
        state: >
          {% set spot_price = states('sensor.dinamikus_brutto_aramar') | float(0) %}
          {% if spot_price > 70.1 %}
            Sell / Use Battery
          {% elif spot_price < 20 %}
            Charge Battery / Buy
          {% else %}
            Standard Operation
          {% endif %}

      - name: "Smart Grid Savings Rate"
        unique_id: sgy_savings_rate
        unit_of_measurement: "Ft/h"
        icon: mdi:currency-huf
        state: >
          {% set spot_price = states('sensor.dinamikus_brutto_aramar') | float(0) %}
          {% set load_power = states('sensor.deye_inverter_load_power') | float(0) / 1000 %}
          {% set grid_power = states('sensor.deye_inverter_external_power') | float(0) / 1000 %}
          {% set static_price = 70.1 %}
          
          {% if grid_power <= 0 %}
            {{ (load_power * static_price) | round(2) }}
          {% else %}
            {% set self_consumed = load_power - grid_power %}
            {{ ((self_consumed * static_price) + (grid_power * spot_price)) | round(2) }}
          {% endif %}

sensor:
  - platform: integration
    source: sensor.smart_grid_savings_rate
    name: "SGY Total Accumulator"
    unique_id: sgy_accumulator
    method: left
    unit_time: h
    round: 2

utility_meter:
  sgy_daily_savings:
    source: sensor.sgy_total_accumulator
    name: "SGY Daily Savings"
    unique_id: sgy_daily_savings_uid
    cycle: daily
  sgy_monthly_savings:
    source: sensor.sgy_total_accumulator
    name: "SGY Monthly Savings"
    unique_id: sgy_monthly_savings_uid
    cycle: monthly
  sgy_yearly_savings:
    source: sensor.sgy_total_accumulator
    name: "SGY Yearly Savings"
    unique_id: sgy_yearly_savings_uid
    cycle: yearly
